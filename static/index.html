<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js"></script>

</head>
<body>
    <div class="container">
        <h1>🏥 Test_result Predictor</h1>
        <form id="predictionForm">
            <div class="form-grid">
                <!-- Left Column -->
                <div class="column">
                    <label>Patient Name</label>
                    <input type="text" id="Name" value="John Doe" required>

                    <label>Age</label>
                    <input type="number" id="Age" value="45" required>

                    <label>Gender</label>
                    <select id="Gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>

                    <label>Blood Type</label>
                    <select id="Blood_Type">
                        <option value="A+">A+</option>
                        <option value="O+">O+</option>
                        <option value="B-">B-</option>
                    </select>

                    <label>Medical Condition</label>
                    <input type="text" id="Medical_Condition" value="Diabetes">
                    
                    <label>Doctor</label>
                    <input type="text" id="Doctor" value="Dr. Smith">
                </div>

                <!-- Right Column -->
                <div class="column">
                    <label>Hospital</label>
                    <input type="text" id="Hospital" value="Central Clinic">

                    <label>Insurance Provider</label>
                    <input type="text" id="Insurance_Provider" value="Aetna">

                    <label>Billing Amount</label>
                    <input type="number" id="Billing_Amount" value="1200">

                    <label>Room Number</label>
                    <input type="number" id="Room_Number" value="101">

                    <label>Admission Type</label>
                    <select id="Admission_Type">
                        <option value="Emergency">Emergency</option>
                        <option value="Urgent">Urgent</option>
                        <option value="Elective">Elective</option>
                    </select>

                    <label>Medication</label>
                    <input type="text" id="Medication" value="Aspirin">

                    <label>Days in Hospital</label>
                    <input type="number" id="Days_in_hospital" value="5">
                </div>
            </div>
            <button type="submit">Predict Result</button>
        </form>

        <div id="result" class="result-box"></div>
    </div>   
</body>
</html>
